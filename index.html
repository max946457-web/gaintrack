<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09"><title>GainTrack</title>
<style>
:root{--bg:#080b09;--card:#101511;--card2:#151c17;--line:#273129;--text:#f4f8f4;--muted:#8d998f;--g:#8cffad;--g2:#36d878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:560px;margin:auto;padding:18px 15px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 18px}.brand{font-size:23px;font-weight:900}.brand b{color:var(--g)}button,input,select,textarea{font:inherit}button{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:45px;font-weight:750}button.primary{background:var(--g);color:#071009;border-color:var(--g)}.icon{width:44px;padding:0;display:grid;place-items:center}.icon svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card{background:linear-gradient(145deg,#111712,#0d120f);border:1px solid var(--line);border-radius:24px;padding:17px;margin-bottom:13px;box-shadow:0 16px 45px #0008}.hero{display:flex;align-items:center;gap:17px;min-height:215px;overflow:hidden}.ring{width:150px;height:150px;flex:none;border-radius:50%;background:conic-gradient(var(--g) var(--pct),#253229 0);display:grid;place-items:center}.ring:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#0a0e0b;border:1px solid #263229}.ringin{position:relative;text-align:center}.big{font-size:33px;font-weight:900}.small{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px;margin-top:4px}h1{font-size:30px;letter-spacing:-1px;margin:4px 0}h2{font-size:21px;margin:0 0 5px}h3{font-size:16px;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d120f;border:1px solid var(--line);border-radius:18px;padding:14px}.stat strong{display:block;font-size:20px;margin-top:5px}.progress{height:8px;background:#202a22;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px}.next{display:flex;align-items:center;gap:13px;margin-top:12px}.datebox{width:52px;height:57px;border-radius:15px;background:#18221b;border:1px solid #2b392e;display:grid;place-items:center}.datebox strong{font-size:20px}.datebox span{font-size:10px;color:var(--g);text-transform:uppercase}.mealhead,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.meal{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0}.mealname{font-weight:800}.empty{text-align:center;padding:18px;color:var(--muted)}label{font-size:13px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;margin-top:5px;padding:12px 13px;background:#0a0f0c;color:var(--text);border:1px solid var(--line);border-radius:14px}textarea{min-height:90px}.form{display:grid;gap:11px}.tabs{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0f0ddd;border-top:1px solid #232b25;backdrop-filter:blur(20px)}.tab{background:transparent;border:0;color:#748078;min-height:57px;padding:5px 2px;font-size:10px}.tab svg{display:block;margin:0 auto 4px}.tab.active{color:var(--g);background:#172019}.modal{position:fixed;z-index:30;inset:0;background:#000b;display:flex;align-items:flex-end}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#101511;border:1px solid #2a342c;border-radius:28px 28px 0 0;padding:19px 16px calc(20px + env(safe-area-inset-bottom))}.chart{width:100%;height:230px}.chartline{fill:none;stroke:var(--g);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--g);stroke:#0b100d;stroke-width:2}.axis{font-size:10px;fill:#68736b}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(500px,100%)}.logo{font-size:42px;font-weight:950;letter-spacing:-2px}.logo b{color:var(--g)}
</style></head><body><div id="root"></div>
<script>
const KEY="gaintrack_v3";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{profile:null,targets:[],recipes:[],days:{},sports:[],weights:[],tab:"home"};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),today=()=>new Date().toISOString().slice(0,10),id=()=>Date.now()+"_"+Math.random();
const dt=d=>new Date(d+"T12:00:00"),fmt=d=>dt(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}),days=["So","Mo","Di","Mi","Do","Fr","Sa"];
function w(){return S.weights.length?S.weights.at(-1).weight:S.profile.weight}function totals(d=today()){let a=S.days[d]?.items||[];return{k:a.reduce((n,x)=>n+(+x.kcal||0),0),p:a.reduce((n,x)=>n+(+x.protein||0),0)}}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ico(n){let p={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-6h6v6"/>',meal:'<path d="M6 3v8M3.5 3v5.5a2.5 2.5 0 0 0 5 0V3M6 11v10M16 3v18M16 3c4 2 4 7 0 9"/>',book:'<path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 0 5 22z"/><path d="M5 4.5V19a3 3 0 0 0 3 3"/><path d="M9 6h7"/>',sport:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12 2 2 6-6"/>',scale:'<path d="M4 5h16M6 5v15h12V5M9 9h6M10 13h4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 15a2 2 0 0 0 .4 2l.1.1-1.5 1.4-.1-.1a2 2 0 0 0-2-.4 2 2 0 0 0-1 1.7V20h-2v-.3a2 2 0 0 0-1.1-1.7 2 2 0 0 0-2 .4l-.1.1-1.4-1.4.1-.1a2 2 0 0 0 .3-2A2 2 0 0 0 7 14H6v-2h1a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.3-2l-.1-.1 1.4-1.4.1.1a2 2 0 0 0 2 .3A2 2 0 0 0 13 6V5h2v1a2 2 0 0 0 1 1.7 2 2 0 0 0 2-.3l.1-.1 1.4 1.4-.1.1a2 2 0 0 0-.3 2A2 2 0 0 0 21 12h1v2h-1a2 2 0 0 0-2 1z"/>'};return "<svg viewBox=\"0 0 24 24\">"+p[n]+"</svg>"}
function header(title,sub){return '<div class="top"><div><div class="brand">gain<b>track</b></div><div class="tiny">'+esc(sub||"")+'</div></div><button class="icon" id="settings">'+ico("gear")+'</button></div>'}
function nextSport(){let now=new Date(),out=[];for(let a=0;a<8;a++){let d=new Date(now);d.setDate(now.getDate()+a);let day=days[d.getDay()];S.sports.filter(s=>s.days.includes(day)).forEach(s=>{let x=new Date(d),[h,m]=s.time.split(":");x.setHours(+h,+m,0,0);if(x>=now)out.push({d:x,s})})}return out.sort((a,b)=>a.d-b.d)[0]}
function render(){if(!S.profile)return login();document.getElementById("root").innerHTML='<main class="app"><div id="page"></div></main><nav class="tabs">'+[['home','Start'],['day','Tag'],['recipes','Rezepte'],['sport','Sport'],['weight','Gewicht']].map(x=>'<button class="tab '+(S.tab==x[0]?'active':'')+'" data-t="'+x[0]+'">'+ico(x[0]=="home"?"home":x[0]=="day"?"meal":x[0]=="recipes"?"book":x[0]=="sport"?"sport":"scale")+'<span>'+x[1]+'</span></button>').join("")+'</nav>';document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render()});({home,day,recipes,sport,weight}[S.tab]||home)()}
function home(){let t=totals(),cur=w(),tar=S.targets.slice().sort((a,b)=>a.date.localeCompare(b.date)).find(x=>x.date>=today())||S.targets.at(-1),start=S.profile.startWeight||cur,p=tar&&tar.weight!=start?Math.max(0,Math.min(100,(cur-start)/(tar.weight-start)*100)):0,ns=nextSport();document.getElementById("page").innerHTML=header("Start","Dein heutiger Überblick")+'<section class="card hero" style="--pct:'+p+'%"><div class="ring"><div class="ringin"><div class="big">'+cur.toFixed(1)+'</div><div class="small">kg</div></div></div><div><div class="small">Zielgewicht</div><h1>'+(tar?tar.weight+" kg":"Noch offen")+'</h1><div class="muted">'+(tar?fmt(tar.date):"Füge ein Ziel hinzu")+'</div><div class="tiny" style="margin-top:12px">'+Math.round(p)+'% erreicht</div></div></section><div class="grid2"><div class="stat"><div class="small">Kalorien</div><strong>'+t.k+' kcal</strong><div class="tiny">'+Math.max(0,S.profile.kcal-t.k)+' offen</div></div><div class="stat"><div class="small">Protein</div><strong>'+Math.round(t.p)+' g</strong><div class="tiny">'+Math.max(0,Math.round(S.profile.protein-t.p))+' g offen</div></div></div><section class="card" style="margin-top:13px"><div class="small">Nächstes Training</div>'+(ns?'<div class="next"><div class="datebox"><strong>'+ns.d.getDate()+'</strong><span>'+ns.d.toLocaleDateString("de-DE",{month:"short"})+'</span></div><div><h3>'+esc(ns.s.name)+'</h3><div class="muted">'+ns.d.toLocaleDateString("de-DE",{weekday:"long"})+' · '+ns.s.time+' · '+ns.s.duration+' min</div></div></div>':'<div class="muted" style="margin-top:9px">Noch kein Training geplant.</div>')+'</section><section class="card"><div class="row"><div><div class="small">Gewicht heute</div><div class="muted">Zuletzt: '+cur.toFixed(1)+' kg</div></div><button class="primary" id="qw">Eintragen</button></div></section>';settings.onclick=settings;qw.onclick=addWeight}
function day(){let t=totals(),h=header("Tagesplan","Heute · "+fmt(today()));h+='<section class="card"><div class="row"><div><div class="small">Tagesziel</div><h2>'+t.k+' / '+S.profile.kcal+' kcal</h2></div><div class="tiny">'+Math.max(0,S.profile.kcal-t.k)+' offen</div></div><div class="progress"><i style="width:'+Math.min(100,t.k/S.profile.kcal*100)+'%"></i></div><div class="tiny">'+Math.round(t.p)+' / '+S.profile.protein+' g Protein</div></section>';for(let c of ["morgens","mittags","abends"]){let a=S.days[today()]?.items?.filter(x=>x.cat==c)||[];h+='<section class="card"><div class="mealhead"><h2>'+c[0].toUpperCase()+c.slice(1)+'</h2><button class="primary add" data-c="'+c+'">+ Essen</button></div>'+(a.map(x=>'<div class="meal"><div><div class="mealname">'+esc(x.name)+'</div><div class="tiny">'+x.kcal+' kcal · '+x.protein+' g Protein</div></div><button class="icon" data-del="'+x.id+'">×</button></div>').join("")||'<div class="empty">Noch nichts eingetragen.</div>')+'</section>'}h+='<section class="card"><div class="small">Letzte Tage</div>'+Object.keys(S.days).sort().reverse().slice(0,7).map(d=>'<div class="meal"><span>'+fmt(d)+'</span><b>'+totals(d).k+' kcal</b></div>').join("")+'</section>';page.innerHTML=h;document.querySelectorAll(".add").forEach(b=>b.onclick=()=>addMeal(b.dataset.c));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.days[today()].items=S.days[today()].items.filter(x=>x.id!=b.dataset.del);save();render()})}
function addMeal(cat){
 let opts=S.recipes.map(r=>'<option value="'+r.id+'">'+esc(r.name)+' · '+r.kcal+' kcal / '+(r.quantity||"1 Portion")+'</option>').join("");
 modal('<div class="row"><h2>Essen hinzufügen</h2><button class="icon" id="x">×</button></div><div class="form">'+
 '<div><label>Gespeichertes Essen</label><select id="pick"><option value="">+ Neues Essen</option>'+opts+'</select></div>'+
 '<div id="nf"><div><label>Name</label><input id="mn" placeholder="z.B. Morgenshake"></div>'+
 '<div class="grid2"><div><label>Grundmenge (g)</label><input id="mb" type="number" placeholder="750"></div><div><label>Gegessene Menge (g)</label><input id="mq" type="number" placeholder="700"></div></div>'+
 '<div class="grid2"><div><label>kcal für Grundmenge</label><input id="mk" type="number" placeholder="800"></div><div><label>Protein für Grundmenge (g)</label><input id="mp" type="number" placeholder="30"></div></div>'+
 '<div><label>Zutaten / Rezept optional</label><textarea id="mr" placeholder="Für eine genauere KI-Schätzung kannst du hier Zutaten und Rezept eintragen."></textarea></div>'+
 '<button type="button" id="ai" style="border-color:#42634d;color:var(--g)">KI-Schätzung vorbereiten</button>'+
 '</div>'+
 '<div id="savedfields" style="display:none"><div class="grid2"><div><label>Gegessene Menge (g)</label><input id="sq" type="number" placeholder="700"></div><div><label>Grundmenge (g)</label><input id="sb" type="number" readonly></div></div><div class="card" style="margin:0;padding:13px"><div class="small">Berechnete Menge</div><h2 id="calc">—</h2><div class="tiny" id="calcp">—</div></div></div>'+
 '<div class="row"><button id="can">Abbrechen</button><button class="primary" id="ok">Hinzufügen</button></div></div>');
 x.onclick=can.onclick=closeModal;
 pick.onchange=()=>{
   const r=S.recipes.find(x=>x.id==pick.value);
   nf.style.display=r?"none":"block"; savedfields.style.display=r?"block":"none";
   if(r){sb.value=r.quantity||"";sq.value=r.quantity||"";updateScaled(r)}
 };
 function updateScaled(r){
   let base=+r.quantity||0, qty=+sq.value||0;
   if(!base||!qty){calc.textContent="—";calcp.textContent="Menge eingeben";return}
   let kcal=(+r.kcal||0)*qty/base, prot=(+r.protein||0)*qty/base;
   calc.textContent=Math.round(kcal)+" kcal";calcp.textContent=Math.round(prot)+" g Protein";
 }
 sq.oninput=()=>{let r=S.recipes.find(x=>x.id==pick.value);if(r)updateScaled(r)};
 ai.onclick=()=>alert("Die KI-Fotoanalyse ist in der Oberfläche vorbereitet. Für die echte Bildanalyse braucht GainTrack noch eine sichere KI-API-Verbindung. Rezept + Zutaten kannst du schon jetzt für die spätere Analyse hinterlegen.");
 ok.onclick=()=>{
   let r=S.recipes.find(x=>x.id==pick.value),item;
   if(r){
     let base=+r.quantity||1, qty=+sq.value||base;
     item={name:r.name,kcal:Math.round((+r.kcal||0)*qty/base),protein:Math.round((+r.protein||0)*qty/base),quantity:qty};
   }else{
     if(!mn.value||isNaN(+mk.value)||isNaN(+mp.value))return alert("Bitte Name, kcal und Protein ausfüllen.");
     let base=+mb.value||1, qty=+mq.value||base;
     item={name:mn.value,kcal:Math.round((+mk.value||0)*qty/base),protein:Math.round((+mp.value||0)*qty/base),quantity:qty};
     S.recipes.push({id:id(),name:item.name,kcal:+mk.value,protein:+mp.value,quantity:base,recipe:mr.value||""});
   }
   S.days[today()]??={items:[]};S.days[today()].items.push({id:id(),cat,...item});save();closeModal();render();
 }
} 
function recipes(){page.innerHTML=header("Meine Rezepte","Einmal eingetragen, immer wieder auswählbar")+'<section class="card"><button class="primary" id="nr">+ Rezept speichern</button><input id="search" placeholder="Gericht suchen …"><div id="rl"></div></section>';function list(){rl.innerHTML=S.recipes.filter(r=>r.name.toLowerCase().includes(search.value.toLowerCase())).map(r=>'<div class="meal"><div><div class="mealname">'+esc(r.name)+'</div><div class="tiny">'+r.kcal+' kcal · '+r.protein+' g Protein · '+(r.quantity||1)+' g</div></div><button data-use="'+r.id+'">+ Tag</button></div>').join("")||'<div class="empty">Noch keine Rezepte.</div>';document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{let r=S.recipes.find(x=>x.id==b.dataset.use);S.days[today()]??={items:[]};S.days[today()].items.push({id:id(),cat:"abends",name:r.name,kcal:r.kcal,protein:r.protein});save();render()})}search.oninput=list;list();nr.onclick=addRecipe}
function addRecipe(){
 modal('<div class="row"><h2>Rezept speichern</h2><button class="icon" id="x">×</button></div><div class="form">'+
 '<div><label>Name</label><input id="rn" placeholder="z.B. Morgenshake"></div>'+
 '<div class="grid2"><div><label>Grundmenge (g)</label><input id="rq" type="number" placeholder="750"></div><div><label>kcal für Grundmenge</label><input id="rk" type="number" placeholder="850"></div></div>'+
 '<div><label>Protein für Grundmenge (g)</label><input id="rp" type="number" placeholder="35"></div>'+
 '<div><label>Zutaten / Rezept</label><textarea id="rr" placeholder="Alle Zutaten und Mengen hier eintragen…"></textarea></div>'+
 '<button type="button" id="ai" style="border-color:#42634d;color:var(--g)">KI-Schätzung vorbereiten</button>'+
 '<div class="tiny">Beispiel: Rezept = 750 g und 850 kcal. Beim Essen kannst du später z.B. 350 g auswählen – GainTrack rechnet automatisch auf 397 kcal herunter.</div>'+
 '<div class="row"><button id="can">Abbrechen</button><button class="primary" id="ok">Speichern</button></div></div>');
 x.onclick=can.onclick=closeModal;
 ai.onclick=()=>alert("Die KI-Fotoanalyse ist in der Oberfläche vorbereitet. Für die echte Bildanalyse braucht GainTrack noch eine sichere KI-API-Verbindung.");
 ok.onclick=()=>{
   if(!rn.value||isNaN(+rq.value)||isNaN(+rk.value)||isNaN(+rp.value))return alert("Bitte Name, Grundmenge, kcal und Protein ausfüllen.");
   S.recipes.push({id:id(),name:rn.value,kcal:+rk.value,protein:+rp.value,quantity:+rq.value,recipe:rr.value||""});
   save();closeModal();render();
 }
}

function sport(){let ns=nextSport();page.innerHTML=header("Sport","Trainingsplan")+'<section class="card"><button class="primary" id="nsb">+ Training planen</button>'+ (S.sports.map(s=>'<div class="meal"><div><b>'+esc(s.name)+'</b><div class="tiny">'+s.days.join(" · ")+' · '+s.time+' · '+s.duration+' min</div></div><button class="icon" data-rm="'+s.id+'">×</button></div>').join("")||'<div class="empty">Noch kein Training geplant.</div>')+'</section><section class="card"><div class="small">Nächstes Training</div><h2 style="margin-top:6px">'+(ns?esc(ns.s.name):"—")+'</h2><div class="muted">'+(ns?ns.d.toLocaleString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"")+'</div></section>';nsb.onclick=addSport;document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.sports=S.sports.filter(s=>s.id!=b.dataset.rm);save();render()})}
function addSport(){modal('<div class="row"><h2>Training planen</h2><button class="icon" id="x">×</button></div><div class="form"><div><label>Name</label><input id="sn" value="Gym"></div><div><label>Wochentage</label><input id="sd" value="Mo,Mi,Fr"></div><div class="grid2"><div><label>Start</label><input id="st" type="time" value="15:00"></div><div><label>Dauer min</label><input id="su" type="number" value="60"></div></div><div class="row"><button id="can">Abbrechen</button><button class="primary" id="ok">Speichern</button></div></div>');x.onclick=can.onclick=closeModal;ok.onclick=()=>{S.sports.push({id:id(),name:sn.value,days:sd.value.split(",").map(x=>x.trim()).filter(Boolean),time:st.value,duration:+su.value});save();closeModal();render()}}
function weight(){let a=S.weights.slice().sort((x,y)=>x.date.localeCompare(y.date)),trend=null;if(a.length>=2){let dd=(dt(a.at(-1).date)-dt(a[0].date))/86400000;trend=dd?((a.at(-1).weight-a[0].weight)/(dd/7)):null}page.innerHTML=header("Gewicht","Verlauf, Trend & Ziele")+'<section class="card"><div class="row"><div><div class="small">Aktuell</div><h1>'+w().toFixed(1)+' kg</h1></div><button class="primary" id="aw">+ Heute</button></div>'+(trend!==null?'<div style="margin-top:10px"><div class="small">Durchschnitt pro Woche</div><h2 class="'+(trend>=0?"green":"")+'">'+(trend>=0?"+":"")+trend.toFixed(2)+' kg/Woche</h2></div>':'<div class="tiny">Trage regelmäßig dein Gewicht ein.</div>')+'</section><section class="card"><div class="row"><h2>Diagramm</h2><span class="tiny">'+a.length+' Messungen</span></div>'+chart(a)+'</section><section class="card"><div class="small">Messungen</div>'+a.slice().reverse().map(x=>'<div class="meal"><span>'+fmt(x.date)+'</span><b>'+x.weight.toFixed(1)+' kg</b></div>').join("")+'</section><section class="card"><div class="row"><h2>Ziele</h2><button id="at">+ Ziel</button></div>'+S.targets.map(x=>'<div class="meal"><span>'+x.weight+' kg</span><b>'+fmt(x.date)+'</b></div>').join("")+'</section>';aw.onclick=addWeight;at.onclick=addTarget}
function chart(a){if(a.length<2)return '<div class="empty">Mindestens 2 Messungen für ein Diagramm.</div>';let W=500,H=220,p=25,min=Math.min(...a.map(x=>x.weight)),max=Math.max(...a.map(x=>x.weight)),r=Math.max(.5,max-min),pts=a.map((x,i)=>[p+i*(W-2*p)/(a.length-1),H-p-(x.weight-(min-r*.1))/(r*1.2)*(H-2*p)]);return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><path class="chartline" d="'+pts.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ")+'"/>'+pts.map((q,i)=>'<circle class="dot" cx="'+q[0]+'" cy="'+q[1]+'" r="4"><title>'+a[i].weight+' kg · '+fmt(a[i].date)+'</title></circle>').join("")+'<text class="axis" x="4" y="15">'+max.toFixed(1)+' kg</text><text class="axis" x="4" y="'+(H-5)+'">'+min.toFixed(1)+' kg</text></svg>'}
function addWeight(){let x=prompt("Gewicht heute in kg",w().toFixed(1));if(!x||isNaN(+x))return;S.weights=S.weights.filter(a=>a.date!=today());S.weights.push({date:today(),weight:+x});S.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function addTarget(){let d=prompt("Zieldatum YYYY-MM-DD","2027-05-17"),x=prompt("Zielgewicht kg","75");if(d&&x&&!isNaN(+x)){S.targets.push({date:d,weight:+x});save();render()}}
function settings(){modal('<div class="row"><h2>Einstellungen</h2><button class="icon" id="x">×</button></div><div class="form"><div><label>Name</label><input id="en" value="'+esc(S.profile.name)+'"></div><div class="grid2"><div><label>kcal Ziel</label><input id="ek" type="number" value="'+S.profile.kcal+'"></div><div><label>Protein Ziel</label><input id="ep" type="number" value="'+S.profile.protein+'"></div></div><button class="primary" id="ok">Speichern</button><hr><button id="reset" style="color:#ff7b80">Lokale Daten löschen</button></div>');x.onclick=closeModal;ok.onclick=()=>{S.profile.name=en.value;S.profile.kcal=+ek.value;S.profile.protein=+ep.value;save();closeModal();render()};reset.onclick=()=>{if(confirm("Alle Daten löschen?")){localStorage.removeItem(KEY);location.reload()}}}
function modal(s){let m=document.createElement("div");m.className="modal";m.innerHTML='<div class="sheet">'+s+'</div>';document.body.appendChild(m);window._m=m}function closeModal(){window._m?.remove()}
function login(){root.innerHTML='<div class="login"><section class="card"><div class="logo">gain<b>track</b></div><p class="muted">Zunehmen. Muskeln aufbauen. Fortschritt sehen.</p><form id="f" class="form" style="margin-top:18px"><div><label>Name</label><input id="name" required></div><div class="grid2"><div><label>Alter</label><input id="age" type="number" required></div><div><label>Geschlecht</label><select id="sex"><option>Männlich</option><option>Weiblich</option><option>Keine Angabe</option></select></div></div><div class="grid2"><div><label>Größe cm</label><input id="height" type="number" required></div><div><label>Startgewicht kg</label><input id="start" type="number" step=".1" required></div></div><div class="grid2"><div><label>Ziel</label><select id="goal"><option value="gain">Zunehmen</option><option value="lose">Abnehmen</option><option value="hold">Halten</option></select></div><div><label>Muskelaufbau</label><select id="muscle"><option value="yes">Ja</option><option value="no">Nein</option></select></div></div><div class="grid2"><div><label>Tagesziel kcal</label><input id="kcal" type="number" value="3200"></div><div><label>Protein g</label><input id="protein" type="number" value="115"></div></div><button class="primary">App starten</button></form></section></div>';f.onsubmit=e=>{e.preventDefault();S.profile={name:name.value,age:+age.value,sex:sex.value,height:+height.value,weight:+start.value,startWeight:+start.value,goal:goal.value,muscle:muscle.value,kcal:+kcal.value,protein:+protein.value};S.weights=[{date:today(),weight:+start.value}];save();render()}}
render();
</script></body></html>
